services:
  - type: web
    name: invoicepilot-paychase
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CHASER_INTERVAL_SECONDS
        value: "60"
      - key: DEV_ADMIN_TOKEN
        sync: false
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "20"
